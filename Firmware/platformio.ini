; TinyRFID — ESP32 EM4100 tag emulator with web interface
;
; Build & upload:
;   pio run -t upload
;   pio device monitor
;
; After flashing, the ESP32 starts a WiFi access point (default SSID
; "TinyRFID", password "tinyrfid123"). Connect to it and open
; http://192.168.4.1/ to manage and transmit card IDs.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    ; Pin used to drive the coil / antenna (change to match your hardware)
    -D EM4100_TX_PIN=4
